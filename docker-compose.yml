# docker-compose.yml — Versión 3: el mismo sistema contra dos motores
#
# Cuatro servicios (más phpMyAdmin para inspeccionar MariaDB) y UNA sola
# imagen de API que escoge el motor al arrancar según DB_MOTOR.
#
# Cambiar de motor (sin reconstruir, solo recreando la API):
#   $env:DB_MOTOR = "postgres"; docker compose up -d --no-deps --force-recreate api-gestion
#   $env:DB_MOTOR = "mariadb";  docker compose up -d --no-deps --force-recreate api-gestion
#
# NOTA: algunos documentos del spec-kit escriben "MOTOR"; el nombre real
# que usa el compose, el quickstart y las tareas es "DB_MOTOR".
# El código lee esta variable al arrancar (no en cada petición).

name: mi_v3_motores

services:

  # ─── MariaDB: el motor por defecto desde la v1 ──────────────────────────
  mariadb:
    image: mariadb:11
    container_name: mi_v3_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: paradigmas123
      MARIADB_DATABASE: bdgestion_mariadb_local
      MARIADB_USER: paradigmas
      MARIADB_PASSWORD: paradigmas123
    ports:
      - "13428:3306"
    volumes:
      - mariadbdata:/var/lib/mysql
      - ./db/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── PostgreSQL: el motor que estrena la v3 ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mi_v3_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bdgestion_postgres_local
      POSTGRES_USER: paradigmas
      POSTGRES_PASSWORD: paradigmas123
    ports:
      - "15564:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paradigmas -d bdgestion_postgres_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── La API: UNA sola imagen que sirve para los dos motores ─────────────
  api-gestion:
    build:
      context: ./api_gestion
    container_name: mi_v3_api
    restart: unless-stopped
    environment:
      # El motor se lee al arrancar. Valor desconocido ⇒ MariaDB (RF1).
      DB_MOTOR: ${DB_MOTOR:-mariadb}
      # Los DOS juegos de conexión viajan siempre; el ensamblador usa
      # el que corresponde a motorActivo(). Solo cambia el DSN (RNF5).
      MARIADB_DSN: "mysql:host=mariadb;port=3306;dbname=bdgestion_mariadb_local;charset=utf8mb4"
      MARIADB_USUARIO: paradigmas
      MARIADB_CLAVE: paradigmas123
      POSTGRES_DSN: "pgsql:host=postgres;port=5432;dbname=bdgestion_postgres_local"
      POSTGRES_USUARIO: paradigmas
      POSTGRES_CLAVE: paradigmas123
    ports:
      - "8186:8086"
    depends_on:
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── El front: no sabe ni le importa qué motor hay detrás ───────────────
  front-php:
    build:
      context: ./front_php
    container_name: mi_v3_front
    restart: unless-stopped
    environment:
      URL_API: "http://api-gestion:8086"
    ports:
      - "8184:8084"
    depends_on:
      - api-gestion

  # ─── phpMyAdmin: para inspeccionar MariaDB desde el navegador ───────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mi_v3_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8203:80"
    depends_on:
      - mariadb

volumes:
  mariadbdata:
  pgdata: